version: '3.9'

services:
  shipping-calc:
    build: .
    container_name: shipping-calc
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=default
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8080/api/shipping/health"]
      interval: 30s
      timeout: 10s
      retries: 3
